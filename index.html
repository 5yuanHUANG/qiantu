<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>錢途</title>
<meta name="description" content="個人財務規劃：記帳、現金流、股票、貸款與「該不該買」分析">
<meta name="theme-color" content="#EDF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="錢途">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: single phone column, sticky header, fixed bottom tab bar; ledger-paper neutrals with a deep jade accent. Taiwan convention: red = 漲, green = 跌 */
:root{
  --bg:#EDF1EF;--surface:#FFFFFF;--surface2:#F5F8F6;--ink:#13201C;--muted:#5D6B67;--line:#D7DFDC;
  --accent:#1C5A50;--accent-ink:#FFFFFF;--accent-soft:#DAEAE4;
  --up:#C3362B;--down:#1C8549;--warn:#9A6210;--warn-soft:#F6E9D2;--bad-soft:#F7DFDB;--ok-soft:#DCEFE2;
  --shadow:0 1px 2px rgba(19,32,28,.05),0 6px 18px rgba(19,32,28,.06);
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412;--surface:#161F1C;--surface2:#1B2622;--ink:#E4ECE9;--muted:#91A09B;--line:#28332F;
  --accent:#72C6B3;--accent-ink:#0B1714;--accent-soft:#1D3530;
  --up:#F06A5F;--down:#52C386;--warn:#E3AA4E;--warn-soft:#3A2E18;--bad-soft:#3C1F1C;--ok-soft:#183324;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412;--surface:#161F1C;--surface2:#1B2622;--ink:#E4ECE9;--muted:#91A09B;--line:#28332F;
  --accent:#72C6B3;--accent-ink:#0B1714;--accent-soft:#1D3530;
  --up:#F06A5F;--down:#52C386;--warn:#E3AA4E;--warn-soft:#3A2E18;--bad-soft:#3C1F1C;--ok-soft:#183324;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;gap:12px}
header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
header.top .sub{font-size:12px;color:var(--muted)}
.brand{display:flex;align-items:center;gap:10px}.brand img{border-radius:9px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
#view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px}
.label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.big{font-size:32px;font-weight:600;line-height:1.15}
.mid{font-size:20px;font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px;min-width:0}
.stat .v{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.hero{background:var(--accent);color:var(--accent-ink)}
.hero .label{color:inherit;opacity:.8}
.hero .stat{background:rgba(255,255,255,.12)}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}
.pos{color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--up)}
.bar.mid>i{background:var(--warn)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding-block:11px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-weight:600;text-align:right;white-space:nowrap}
.tag{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--down)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--up)}
.alert{display:flex;gap:10px;padding:12px;border-radius:14px;font-size:14px;align-items:flex-start}
.alert.bad{background:var(--bad-soft)}.alert.mid{background:var(--warn-soft)}.alert.ok{background:var(--ok-soft)}.alert.info{background:var(--accent-soft)}
.alert b{display:block}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:currentColor}
.alert.bad .dot{color:var(--up)}.alert.mid .dot{color:var(--warn)}.alert.ok .dot{color:var(--down)}.alert.info .dot{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--up)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button,.seg label{flex:1 0 auto;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-size:14px;cursor:pointer;white-space:nowrap;text-align:center;color:var(--muted)}
.seg button.on,.seg input:checked+span{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.seg label{padding:0}.seg label span{display:block;padding:8px 10px;border-radius:9px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px}
.chips input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
form .f{display:flex;flex-direction:column;gap:5px;min-width:0}
form .f>span{font-size:13px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:12px}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:10px 12px;min-height:44px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
.amount-in{font-family:var(--f-num);font-size:28px;font-weight:600;text-align:right}
.hint{font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(19,32,28,.25);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-back{position:absolute;inset:0;background:rgba(8,14,12,.45)}
.sheet-panel{position:relative;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;width:100%;max-width:560px;margin:0 auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet-panel .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet-panel h3{margin:0 0 12px;font-size:18px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet-panel{animation:none}}
#toast{display:flex;gap:14px;align-items:center;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.toast-undo{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
.quickbar{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.quickbar span{flex:1;color:var(--muted)}
.quickbar b{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;line-height:1}
.qbar{display:flex;gap:8px}.qbar input{flex:1;font-size:17px}
.qsel{width:auto!important;min-height:32px!important;padding:3px 6px!important;font-size:13px;border-radius:8px!important}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-num)}
.c-line{fill:none;stroke:var(--accent);stroke-width:2}
.c-area{fill:var(--accent);fill-opacity:.12}
.c-zero{stroke:var(--up);stroke-dasharray:3 3;stroke-width:1}
.c-grid{stroke:var(--line);stroke-width:1}
.c-min{fill:var(--up)}
.c-in{fill:var(--accent)}
.c-out{fill:var(--muted);fill-opacity:.55}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.verdict{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.verdict.go{background:var(--ok-soft)}.verdict.ok{background:var(--accent-soft)}.verdict.wait{background:var(--warn-soft)}.verdict.no{background:var(--bad-soft)}
.verdict .vt{font-size:22px;font-weight:700}
.verdict.go .vt{color:var(--down)}.verdict.ok .vt{color:var(--accent)}.verdict.wait .vt{color:var(--warn)}.verdict.no .vt{color:var(--up)}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.compare{grid-template-columns:1fr}}
.compare .side{background:var(--surface2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.compare .side h4{margin:0;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600}
.ai-out{font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.ai-out h4{margin:14px 0 4px;font-size:15px}
.ai-out p{margin:6px 0}
.ai-out ul{margin:4px 0;padding-left:20px}
.msg{padding:10px 12px;border-radius:14px;max-width:88%;font-size:14px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.ai{align-self:flex-start;background:var(--surface2)}
.chat{display:flex;flex-direction:column;gap:8px}
.score{width:84px;height:84px;flex:none}
.score .trk{fill:none;stroke:var(--surface2);stroke-width:9}
.score .val{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round}
.score text{fill:var(--ink);font-family:var(--f-num);font-size:22px;font-weight:600}
.daygroup{font-size:12px;color:var(--muted);padding-top:12px;display:flex;justify-content:space-between}
.empty{text-align:center;padding:22px 8px;color:var(--muted);font-size:14px}
.steps{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.steps button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px;cursor:pointer}
.steps b{font-family:var(--f-num);color:var(--accent)}
.overflow{overflow-x:auto}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><img src="icons/icon.svg" alt="" width="34" height="34"><div><h1 id="ttl">總覽</h1><div class="sub" id="syncNote">錢途</div></div></div>
    <button class="icon-btn" data-act="settings" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="view"><div class="card empty">正在讀取你的財務資料…</div></main>
</div>

<button class="fab" data-act="addTx" aria-label="記一筆"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs"><div class="in">
  <button data-act="tab" data-t="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>總覽</button>
  <button data-act="tab" data-t="ledger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>記帳</button>
  <button data-act="tab" data-t="assets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2M7 6V4h10v2"/></svg>資產負債</button>
  <button data-act="tab" data-t="decide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0zM8 21h8"/></svg>該買嗎</button>
  <button data-act="tab" data-t="advisor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg>顧問</button>
</div></nav>

<div id="sheet" class="sheet" hidden><div class="sheet-back" data-act="closeSheet"></div><div class="sheet-panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="receiptFile" accept="image/*" hidden>

<script>
"use strict";
/* ---------- constants ---------- */
const CAT_OUT=['餐飲','交通','居住','日用','購物','娛樂','醫療','教育','保險','稅費','社交','旅遊','3C','寵物','貸款','投資','日常雜支','其他'];
const CAT_IN=['薪資','獎金','股利','利息','副業','退稅','其他收入'];
const FIXED_CATS=['居住','保險','稅費','貸款'];
const ACC_T={cash:'現金',bank:'銀行',credit:'信用卡',ewallet:'電子支付',property:'房產/車/其他資產'};
const LOAN_T=['房貸','信貸','車貸','學貸','其他'];
const MKT={tw:'台股',etf:'ETF',us:'美股',fund:'基金',crypto:'加密貨幣'};
const NEED={must:'生活必需',better:'提升生活品質',want:'純粹想要'};
const TITLES={home:'總覽',ledger:'記帳',assets:'資產負債',decide:'該買嗎？',advisor:'財務顧問'};
const TAX_TPL=[
  {name:'綜合所得稅',month:5,day:31,cat:'稅費'},{name:'房屋稅',month:5,day:31,cat:'稅費'},
  {name:'汽機車牌照稅',month:4,day:30,cat:'稅費'},{name:'汽燃費',month:7,day:31,cat:'稅費'},
  {name:'地價稅',month:11,day:30,cat:'稅費'},{name:'年繳保費',month:1,day:15,cat:'保險'}];

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const uid8=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[,\s]/g,''));return isFinite(n)?n:0};
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const fmt=n=>(n<0?'−':'')+'$'+Math.round(Math.abs(n)).toLocaleString('zh-TW');
const fmtS=n=>{const a=Math.abs(n),sg=n<0?'−':'';if(a>=1e8)return sg+(a/1e8).toFixed(2)+'億';if(a>=1e4)return sg+(a/1e4).toFixed(a>=1e6?0:1)+'萬';return sg+Math.round(a).toLocaleString('zh-TW')};

        if(d.id==='core')S.core=normCore(v);else if(d.id.startsWith('tx-'))S.months[d.id.slice(3)]=v.items||[]}

/* ---------- finance engine ---------- */
function loanCalc(L,extra=+L.extra||0){
  const P=+L.principal||0,r=(+L.rate||0)/1200,n=Math.max(1,Math.round((+L.years||1)*12)),g=Math.min(+L.grace||0,n-1);
  const start=parseD(L.start),today=parseD(todayStr());
  let k=0;while(k<n&&addM(start,k+1)<=today)k++;
  const basePay=pmt(P,r,n-g);let bal=P,i=0,intTotal=0,intPaid=0,balNow=P;
  for(;i<n+1200&&bal>0.5;i++){const intr=bal*r;let pay=i<g?intr:basePay+(i>=k?extra:0);let pr=pay-intr;if(pr>=bal-0.5){pr=bal}bal-=pr;intTotal+=intr;if(i<k){intPaid+=intr;balNow=bal}}
  if(k>=i)balNow=0;
  const done=balNow<=0.5;
  return{pay:done?0:(k<g?P*r:basePay+extra),basePay,balNow:done?0:balNow,k,n,monthsLeft:Math.max(0,i-k),intTotal,intLeft:Math.max(0,intTotal-intPaid),payoff:addM(start,i),inGrace:k<g,graceLeft:Math.max(0,g-k),payDay:start.getDate()}
}
function recActive(r,d){if(r.until&&ymd(d).slice(0,7)>r.until)return false;if(r.from&&ymd(d).slice(0,7)<r.from)return false;return true}
function monthTx(m){return S.months[m]||[]}
function F(){
  const c=S.core,st=c.settings,today=todayStr(),cm=mkey(today),now=new Date();
  const liquid=sum(c.accounts.filter(a=>a.type!=='property'),a=>a.balance);const propVal=sum(c.accounts.filter(a=>a.type==='property'),a=>a.balance);
  const cardDebt=-sum(c.accounts.filter(a=>a.type==='credit'),a=>Math.min(0,+a.balance||0));
  const fx=+st.usd||32;
  const hold=c.holdings.map(h=>{const m=h.cur==='USD'?fx:1;const val=h.shares*h.price*m,cost=h.shares*h.cost*m;return{...h,val,cost,pl:val-cost}});
  const invVal=sum(hold,h=>h.val),invCost=sum(hold,h=>h.cost);
  const loans=c.loans.map(L=>({...L,...loanCalc(L)}));
  const loanBal=sum(loans,l=>l.balNow),loanPay=sum(loans,l=>l.pay);
  const curRec=c.recurring.filter(r=>recActive(r,now));
  const recM=r=>r.freq==='yearly'?(+r.amount||0)/12:(+r.amount||0);
  const recIn=sum(curRec.filter(r=>r.kind==='in'),recM),recOut=sum(curRec.filter(r=>r.kind!=='in'),recM);
  const outOf=m=>sum(monthTx(m).filter(t=>t.type==='out'),t=>t.amount),inOf=m=>sum(monthTx(m).filter(t=>t.type==='in'),t=>t.amount);
  const prev=[1,2,3].map(k=>shiftMonth(cm,-k)).filter(m=>monthTx(m).length);
  const dom=now.getDate();
  const avgOut=prev.length?avg(prev.map(outOf)):outOf(cm)*30/Math.max(dom,1);
  const avgIn=prev.length?avg(prev.map(inOf)):inOf(cm);
  const incomeM=recIn>0?recIn:avgIn;
  const fixedM=recOut+loanPay;
  const spendM=Math.max(avgOut,fixedM);
  const varM=Math.max(0,spendM-fixedM);
  const free=incomeM-spendM;
  const saveRate=incomeM>0?free/incomeM:0;
  const emMonths=spendM>0?liquid/spendM:(liquid>0?99:0);
  const dsr=incomeM>0?loanPay/incomeM:0;
  const netWorth=liquid+propVal+invVal-loanBal;
  const mt=monthTx(cm);const inThis=sum(mt.filter(t=>t.type==='in'),t=>t.amount),outThis=sum(mt.filter(t=>t.type==='out'),t=>t.amount);
  const varThis=sum(mt.filter(t=>t.type==='out'&&!FIXED_CATS.includes(t.cat)),t=>t.amount);
  const allowance=Math.max(0,incomeM*(1-(+st.saveTarget||0)/100)-fixedM);
  const daysLeft=daysIn(now)-dom+1;
  const remain=allowance-varThis;
  const hourly=incomeM>0?incomeM/(+st.hours||176):0;
  return{liquid,propVal,cardDebt,hold,invVal,invCost,loans,loanBal,loanPay,recIn,recOut,incomeM,fixedM,spendM,varM,free,saveRate,emMonths,dsr,netWorth,inThis,outThis,varThis,allowance,remain,daysLeft,perDay:remain/daysLeft,hourly,hasHist:prev.length>0,cm}
}
function forecast(f,extra=[],days=90){
  const c=S.core;let bal=f.liquid;const pts=[bal],evs=[];let min=bal,minDay=0;
  const t0=new Date();t0.setHours(0,0,0,0);
  for(let i=1;i<=days;i++){
    const d=new Date(t0);d.setDate(d.getDate()+i);const dd=d.getDate(),mm=d.getMonth()+1,dim=daysIn(d);
    bal-=f.varM/30;
    for(const r of c.recurring){if(!recActive(r,d))continue;if(dd!==Math.min(+r.day||1,dim))continue;if(r.freq==='yearly'&&+r.month!==mm)continue;
      const v=r.kind==='in'?+r.amount:-r.amount;bal+=v;evs.push({i,date:ymd(d),name:r.name,v})}
    for(const L of f.loans){if(!L.pay)continue;if(dd===Math.min(L.payDay,dim)){bal-=L.pay;evs.push({i,date:ymd(d),name:L.name+' 月付',v:-L.pay})}}
    for(const e of extra)if(e.i===i){bal+=e.v;evs.push({i,date:ymd(d),name:e.name,v:e.v})}
    pts.push(bal);if(bal<min){min=bal;minDay=i}
  }
  return{pts,min,minDay,end:bal,evs}
}
function health(f){

    {k:'90 天現金流',v:fmtS(fc.min),s:fc.min>=f.spendM?2:fc.min>=0?1:0,tip:'未來 90 天現金最低點，低於 0 代表會周轉不靈'}];
  return{items,score:Math.round(sum(items,i=>i.s)/(items.length*2)*100),fc}

function insights(f,fc){
  const out=[],c=S.core,st=c.settings,cm=f.cm;
  if(fc.min<0){const d=new Date();d.setDate(d.getDate()+fc.minDay);out.push({lv:'bad',t:`預計 ${d.getMonth()+1}/${d.getDate()} 現金會不足 ${fmt(-fc.min)}`,d:'請提前調度資金，或延後非必要支出。'})}
  else if(f.spendM>0&&fc.min<f.spendM*.5&&(c.accounts.length))out.push({lv:'mid',t:`90 天內現金最低只剩 ${fmt(fc.min)}`,d:'不到半個月的生活費，接下來花錢要保守一點。'});
  if(c.accounts.length&&f.spendM>0&&f.emMonths<3)out.push({lv:'mid',t:`緊急預備金只夠 ${f.emMonths.toFixed(1)} 個月`,d:`建議先存到 ${st.emMonths} 個月（約 ${fmt(f.spendM*st.emMonths)}）再做大額消費或投資。`});
  if(!st.demo&&!isEmpty()&&(!st.lastBackup||dayDiff(st.lastBackup,todayStr())>30))out.push({lv:'info',t:st.lastBackup?'超過 30 天沒備份了':'還沒有備份過資料',d:'資料只存在這支手機。到「設定」按「匯出備份」，存到雲端硬碟或傳給自己。'});
  if(f.cardDebt>0)out.push({lv:'info',t:`信用卡待繳 ${fmt(f.cardDebt)}`,d:'繳款日記得全額繳清，避免循環利息。'});
  const spent={};for(const t of monthTx(cm))if(t.type==='out')spent[t.cat]=(spent[t.cat]||0)+t.amount;
  const dom=new Date().getDate(),dim=daysIn(new Date());
  for(const [cat,b] of Object.entries(c.budgets)){if(!(b>0))continue;const s=spent[cat]||0;
    if(s>b)out.push({lv:'bad',t:`${cat} 已超支 ${fmt(s-b)}`,d:`本月預算 ${fmt(b)}，已花 ${fmt(s)}。`});
    else if(s/b>dom/dim+.15&&s/b>.6)out.push({lv:'mid',t:`${cat} 花得比預期快`,d:`才過 ${Math.round(dom/dim*100)}% 的月份，已用掉 ${pct(s/b)} 預算。`})}
  const now=new Date();
  for(const r of c.recurring){if(r.freq!=='yearly'||r.kind==='in')continue;let due=new Date(now.getFullYear(),(+r.month||1)-1,1);due.setDate(Math.min(+r.day||1,daysIn(due)));if(due<new Date(now.getFullYear(),now.getMonth(),now.getDate()))due=new Date(due.getFullYear()+1,due.getMonth(),due.getDate());
    const dl=Math.round((due-now)/864e5);if(dl<=45)out.push({lv:'info',t:`${r.name} ${fmt(r.amount)}，${dl<=0?'今天':dl+' 天後'}到期`,d:`${due.getMonth()+1}/${due.getDate()} 前要準備好這筆錢。`})}
  for(const L of f.loans){if(L.inGrace&&L.graceLeft<=6)out.push({lv:'mid',t:`${L.name} 寬限期剩 ${L.graceLeft} 個月`,d:`寬限期結束後月付會從 ${fmt(L.pay)} 變成約 ${fmt(L.basePay)}。`})}
  for(const d of c.decisions){if(d.status==='cooling'&&d.until&&dayDiff(todayStr(),d.until)<=0)out.push({lv:'ok',t:`冷靜期結束：${d.item}`,d:'到「該買嗎」看看你還想要它嗎？',act:'decide'})}
  if(f.incomeM>0&&f.saveRate<0)out.push({lv:'bad',t:'每月入不敷出',d:`平均每月短少 ${fmt(-f.free)}，先從變動支出最高的類別下手。`});
  return out
}

/* ---------- charts ---------- */
function lineChart(pts){
  const W=340,H=140,pl=6,pr=6,pt=16,pb=20,n=pts.length;let lo=Math.min(0,...pts),hi=Math.max(...pts);if(hi===lo)hi=lo+1;const padv=(hi-lo)*.08;hi+=padv;if(lo<0)lo-=padv;
  const x=i=>pl+(W-pl-pr)*i/(n-1),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const d=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  let mi=0;pts.forEach((v,i)=>{if(v<pts[mi])mi=i});
  const t0=new Date();const lab=i=>{const d=new Date(t0);d.setDate(d.getDate()+i);return(d.getMonth()+1)+'/'+d.getDate()};
  const ticks=[0,30,60,90].filter(i=>i<n);
  const mx=x(mi),anchor=mx<60?'start':mx>W-60?'end':'middle';
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="未來 90 天現金餘額預測">
  ${ticks.map(i=>`<line class="c-grid" x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${H-pb}"/><text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===90?'end':'middle'}">${i===0?'今天':lab(i)}</text>`).join('')}
  ${lo<0?`<line class="c-zero" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/>`:''}
  <path class="c-area" d="${d}L${x(n-1)} ${H-pb}L${x(0)} ${H-pb}Z"/><path class="c-line" d="${d}"/>
  <circle class="c-min" cx="${mx}" cy="${y(pts[mi])}" r="3.5"/><text x="${mx}" y="${Math.max(10,y(pts[mi])-7)}" text-anchor="${anchor}">最低 ${fmtS(pts[mi])}</text></svg>`
}
function barChart(rows){
  const W=340,H=140,pb=20,pt=8,n=rows.length,gw=(W-8)/n,bw=Math.min(14,gw/3);const max=Math.max(1,...rows.flatMap(r=>[r.i,r.o]));
  const h=v=>(H-pt-pb)*v/max;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 6 個月收入支出">
  <line class="c-grid" x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}"/>
  ${rows.map((r,k)=>{const cx=4+gw*k+gw/2;return`<rect class="c-in" x="${cx-bw-1}" y="${H-pb-h(r.i)}" width="${bw}" height="${h(r.i)}" rx="2"/><rect class="c-out" x="${cx+1}" y="${H-pb-h(r.o)}" width="${bw}" height="${h(r.o)}" rx="2"/><text x="${cx}" y="${H-6}" text-anchor="middle">${+r.m.slice(5)}月</text>`}).join('')}</svg>`
}
function scoreRing(s){const r=36,c=2*Math.PI*r;return`<svg class="score" viewBox="0 0 84 84" role="img" aria-label="財務健康分數 ${s}"><circle class="trk" cx="42" cy="42" r="${r}"/><circle class="val" cx="42" cy="42" r="${r}" stroke-dasharray="${c*s/100} ${c}" transform="rotate(-90 42 42)"/><text x="42" y="50" text-anchor="middle">${s}</text></svg>`}

/* ---------- decision analyzer ---------- */
function analyze(df){
  const f=F(),st=S.core.settings,price=num(df.price);if(!(price>0))return null;
  const inst=df.mode==='inst',n=Math.max(1,Math.round(num(df.n)||12)),apr=num(df.apr);
  const mp=inst?pmt(price,apr/1200,n):0,total=inst?mp*n:price;
  const extra=[];if(inst){for(let j=1;j<=n;j++){const d=addM(new Date(),j);const i=Math.round((d-new Date().setHours(0,0,0,0))/864e5);if(i<=90)extra.push({i,v:-mp,name:df.item+' 分期'})}}else extra.push({i:1,v:-price,name:df.item||'這筆消費'});
  const base=forecast(f),after=forecast(f,extra);
  const spendAfter=inst?f.spendM+mp:f.spendM;
  const emB=f.spendM>0?f.liquid/f.spendM:99,emA=spendAfter>0?(f.liquid-(inst?0:price))/spendAfter:99;
  const freeA=f.free-(inst?mp:0);
  const ratio=f.free>0?price/f.free:Infinity;
  const r=(+st.ret||6)/100,fv10=price*Math.pow(1+r,10),fv20=price*Math.pow(1+r,20);
  const uses=num(df.uses),life=num(df.life),cpu=uses>0&&life>0?total/(uses*life):0;
  const hours=f.hourly>0?total/f.hourly:0;
  const goals=S.core.goals.filter(g=>g.target>g.saved);
  const delay=f.free>0?total/f.free:Infinity;
  let s=0;const why=[];
  if(f.free<=0){s-=2;why.push('你目前每月收支是負的，任何非必要支出都會加速吃掉存款')}
  if(ratio<=.25){s+=2;why.push(`金額不到一個月結餘的 1/4，影響很小`)}else if(ratio<=1){s+=1;why.push(`大約是${ratio<.6?'半個':'一個'}月的結餘`)}else if(ratio<=3){s-=1;why.push(`要用掉 ${ratio.toFixed(1)} 個月的結餘`)}else if(isFinite(ratio)){s-=2;why.push(`相當於 ${ratio.toFixed(1)} 個月的結餘，是大額支出`)}
  if(emA>=st.emMonths){s+=1}else if(emA<3){s-=2;why.push(`買完緊急預備金只剩 ${emA.toFixed(1)} 個月，低於 3 個月的安全線`)}else why.push(`緊急預備金會從 ${emB.toFixed(1)} 降到 ${emA.toFixed(1)} 個月`);
  if(after.min<0){s-=3;why.push(`未來 90 天現金最低會到 ${fmt(after.min)}，會周轉不靈`)}

const AI_MODEL='claude-opus-5-5';

async function toImageBlock(file){
  const bmp=await createImageBitmap(file);const k=Math.min(1,1568/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);

function aiError(e,text){const A=SDK;
  if(A&&e instanceof A.APIUserAbortError)return{code:'cancelled',text};
  if(A&&e instanceof A.AuthenticationError)return{code:'bad_key',text};
  if(A&&e instanceof A.PermissionDeniedError)return{code:'bad_key',text};
  if(A&&e instanceof A.RateLimitError)return{code:'rate_limited',text};
  if(A&&e instanceof A.APIConnectionError)return{code:'offline',text};
  if(e&&e.name==='AbortError')return{code:'cancelled',text};
  if(e&&e.code)return e;
  return{code:'upstream_error',text,message:String(e&&e.message||e)}}
function makeAI(){
  if(!getKey())return null;
  async function ask(input,opts={}){
    let msgs=(typeof input==='string'?[{role:'user',content:input}]:input).filter(m=>m.content);
    const merged=[];for(const m of msgs){const last=merged[merged.length-1];if(last&&last.role===m.role)last.content+='\n\n'+m.content;else merged.push({role:m.role,content:m.content})}
    const parts=merged.map(m=>({role:m.role,content:m.content}));
    if(opts.images){const imgs=[...(opts.images.length!=null?opts.images:[opts.images])];const last=parts[parts.length-1];last.content=[...(await Promise.all(imgs.map(toImageBlock))),{type:'text',text:last.content}]}
    let text='';
    try{
      const Anthropic=await loadSDK();
      const client=new Anthropic({apiKey:getKey(),dangerouslyAllowBrowser:true});
      const stream=client.beta.messages.stream({model:AI_MODEL,max_tokens:16000,thinking:{type:'adaptive'},output_config:{effort:'medium'},betas:['server-side-fallback-2026-07-01'],fallbacks:'default',messages:parts},{signal:opts.signal});
      stream.on('text',d=>{text+=d;if(opts.onText)opts.onText({text,delta:d})});
      const msg=await stream.finalMessage();
      if(msg.stop_reason==='refusal')throw{code:'refused'};
      const full=msg.content.filter(b=>b.type==='text').map(b=>b.text).join('');
      if(!full.trim())throw{code:'empty_completion'};
      return{text:full,truncated:msg.stop_reason==='max_tokens'}
    }catch(e){throw aiError(e,text)}}
  ask.json=async(input,opts)=>{const r=await ask(input,opts);const m=r.text.match(/[\[{][\s\S]*[\]}]/);try{return JSON.parse(m?m[0]:r.text)}catch(e){throw{code:'invalid_json',text:r.text}}};
  return ask}

function txMonthAdd(t){const m=mkey(t.date);(S.months[m]=S.months[m]||[]).push(t);return m}
function applyTx(t,sg){const a=S.core.accounts.find(x=>x.id===t.acct);const amt=+t.amount*sg;
  if(t.type==='out'&&a)a.balance=+a.balance-amt;else if(t.type==='in'&&a)a.balance=+a.balance+amt;else if(t.type==='xfer'){if(a)a.balance=+a.balance-amt;const b=S.core.accounts.find(x=>x.id===t.to);if(b)b.balance=+b.balance+amt}}
const FORMS={
  tx(fd,form){const t={id:fd.get('id')||uid8(),type:fd.get('type'),amount:num(fd.get('amount')),cat:fd.get('cat')||'其他',acct:fd.get('acct'),date:fd.get('date')||todayStr(),note:String(fd.get('note')||'').trim(),ts:Date.now()};
    if(!(t.amount>0))return toast('請輸入金額');if(t.type==='xfer'){t.to=fd.get('to');t.cat='轉帳';if(t.to===t.acct)return toast('轉出和轉入帳戶不能相同')}
    const om=fd.get('om');const touched=new Set();
    if(om){const arr=S.months[om]||[];const i=arr.findIndex(x=>x.id===t.id);if(i>=0){const old=arr[i];if(!old.demo)applyTx(old,-1);t.ts=old.ts||t.ts;arr.splice(i,1);touched.add(om)}}
    applyTx(t,1);touched.add(txMonthAdd(t));S.lastAcct=t.acct;
    touched.forEach(saveMonth);saveCore();closeSheet();toast(om?'已更新':'已記下 '+fmt(t.amount));
    if(S.pendingDecision){const d=S.core.decisions.find(x=>x.id===S.pendingDecision);if(d){d.status='bought';saveCore()}S.pendingDecision=null}
    render()},
  acc(fd){const id=fd.get('id');const type=fd.get('type');let bal=num(fd.get('balance'));if(type==='credit')bal=-Math.abs(bal);
    const a={id:id||uid8(),name:String(fd.get('name')).trim(),type,balance:bal,payDay:num(fd.get('payDay'))||null};
    const arr=S.core.accounts,i=arr.findIndex(x=>x.id===id);i>=0?arr[i]=a:arr.push(a);saveCore();closeSheet();render()},
  inv(fd){const id=fd.get('id');const h={id:id||uid8(),symbol:String(fd.get('symbol')).trim().toUpperCase(),name:String(fd.get('name')||'').trim(),mkt:fd.get('mkt'),cur:fd.get('cur'),shares:num(fd.get('shares')),cost:num(fd.get('cost')),price:num(fd.get('price'))||num(fd.get('cost'))};
    const arr=S.core.holdings,i=arr.findIndex(x=>x.id===id);i>=0?arr[i]=h:arr.push(h);saveCore();closeSheet();render()},
  prices(fd){for(const h of S.core.holdings){const v=num(fd.get('p_'+h.id));if(v>0)h.price=v}saveCore();closeSheet();toast('股價已更新');render()},
  loan(fd){const id=fd.get('id');const L={id:id||uid8(),name:String(fd.get('name')).trim(),type:fd.get('type'),principal:num(fd.get('principal')),rate:num(fd.get('rate')),years:num(fd.get('years'))||20,grace:num(fd.get('grace')),start:fd.get('start')||todayStr(),extra:num(fd.get('extra')),acct:fd.get('acct')||''};
    if(!(L.principal>0))return toast('請輸入貸款總額');const arr=S.core.loans,i=arr.findIndex(x=>x.id===id);i>=0?arr[i]=L:arr.push(L);saveCore();closeSheet();render()},
  rec(fd){const id=fd.get('id');const r={id:id||uid8(),kind:fd.get('kind'),name:String(fd.get('name')).trim(),amount:num(fd.get('amount')),freq:fd.get('freq'),cat:fd.get('cat'),month:num(fd.get('month'))||1,day:num(fd.get('day'))||1,until:fd.get('until')||'',acct:fd.get('acct')||''};
    if(!(r.amount>0))return toast('請輸入金額');const arr=S.core.recurring,i=arr.findIndex(x=>x.id===id);i>=0?arr[i]=r:arr.push(r);saveCore();closeSheet();render()},
  goal(fd){const id=fd.get('id');const g={id:id||uid8(),name:String(fd.get('name')).trim(),target:num(fd.get('target')),saved:num(fd.get('saved'))+num(fd.get('add')),deadline:fd.get('deadline')||''};
    const arr=S.core.goals,i=arr.findIndex(x=>x.id===id);i>=0?arr[i]=g:arr.push(g);saveCore();closeSheet();render()},
  budget(fd){const b={};for(const c of CAT_OUT){const v=num(fd.get('b_'+c));if(v>0)b[c]=v}S.core.budgets=b;saveCore();closeSheet();render()},
  settings(fd){const st=S.core.settings;for(const k of['emMonths','saveTarget','ret','usd','hours']){const v=num(fd.get(k));if(v>=0)st[k]=v}const au=fd.get('autoRec')==='on';if(au&&!st.autoRec)st.autoLast=todayStr();st.autoRec=au;if(fd.has('defAcct'))st.defAcct=fd.get('defAcct');saveCore();closeSheet();toast('設定已儲存');render()},
  decide(fd){syncDf();S.dres=analyze(S.df);S.dai='';if(!S.dres)return toast('請輸入金額');render();setTimeout(()=>{const v=document.querySelector('.verdict');v&&v.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})},30)},
  chat(fd){const q=String(fd.get('q')||'').trim();if(q)askChat(q)},
  apikey(fd){const k=String(fd.get('key')||'').trim();if(!k||k.startsWith('••'))return closeSheet();if(!/^sk-ant-/.test(k))return toast('金鑰格式應該是 sk-ant- 開頭');try{localStorage.setItem('qt:apikey',k)}catch(e){return toast('無法儲存金鑰')}S.ai=makeAI();S.imgOK=true;closeSheet();render();toast('AI 功能已啟用')},
  quick(fd){const q=String(fd.get('q')||'').trim();if(q)S.qparse=parseAll(q);if(!S.qparse||!S.qparse.length)return toast(q?'找不到金額，例如：午餐 120':'請輸入品項和金額，例如：午餐 120');const L=S.qparse;S.qparse=[];closeSheet();addTxs(L)},
  recon(fd){const list=[];for(const a of S.core.accounts){if(a.type==='property'||!fd.has('r_'+a.id))continue;let v=num(fd.get('r_'+a.id));if(a.type==='credit')v=-Math.abs(v);const diff=Math.round((v-(+a.balance||0))*100)/100;if(Math.abs(diff)<1)continue;
    list.push({id:uid8(),type:diff<0?'out':'in',amount:Math.abs(diff),cat:diff<0?'日常雜支':'其他收入',acct:a.id,date:todayStr(),note:'對帳差額',ts:Date.now()})}
    closeSheet();if(!list.length)return toast('餘額都對得上，不用調整');addTxs(list,`已對帳：補記 ${list.length} 筆差額`)}
};
function syncDf(){const f=$('#dform');if(!f)return;const fd=new FormData(f);for(const k of['item','price','mode','n','apr','cat','need','uses','life','why'])if(fd.has(k))S.df[k]=fd.get(k)}
async function askChat(q){if(!S.ai||S.chatBusy)return;S.chat.push({role:'user',content:q});S.chat.push({role:'assistant',content:''});S.chatBusy=true;render();
  const turns=[{role:'user',content:AI_RULES+snapText()+'\n\n接下來是使用者的問題。'},...S.chat.slice(0,-1).slice(-10)];
  const last=S.chat[S.chat.length-1];aiCtl=new AbortController();
  const bubble=()=>{const els=document.querySelectorAll('#chat .msg.ai .ai-out');return els[els.length-1]};
  if(bubble())bubble().innerHTML='<span class="muted">思考中…</span>';
  try{const r=await S.ai(turns,{cache:false,signal:aiCtl.signal,onText:({text})=>{last.content=text;const b=bubble();if(b)b.innerHTML=md(text)}});last.content=r.text}
  catch(e){last.content=((e&&e.text)||'')+(e&&e.code==='cancelled'?'':'\n\n'+aiErr(e))}
  finally{if(!last.content.trim())S.chat.splice(-2,2);S.chatBusy=false;aiCtl=null;render();const ci=$('#chatIn');ci&&ci.focus()}}

  reDec(d){const x=S.core.decisions.find(y=>y.id===d.id);if(!x)return;S.df={...S.df,item:x.item,price:String(x.price),mode:x.mode||'once',n:x.n||12,apr:x.apr||0,cat:x.cat,need:x.need};S.dres=analyze(S.df);S.dai='';closeSheet();S.tab='decide';render();scrollTo(0,0)},
  stopAI(){aiCtl&&aiCtl.abort()},
  checkup(){runAI(AI_RULES+snapText()+'\n\n請做一次完整財務健檢：## 整體評價（一句話）、## 做得好的地方、## 最該優先處理的 3 件事（依急迫性排序，每件給具體金額與做法）、## 下個月的行動清單。','checkup','checkBusy','ckOut')},
  ask(d){askChat(d.q)},
  clearChat(){S.chat=[];render()}
};
function resetDf(){S.df={item:'',price:'',mode:'once',n:12,apr:0,cat:'購物',need:'want',uses:4,life:24,why:''};S.dres=null;S.dai=''}

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;if(a.tagName==='FORM')return;const fn=ACT[a.dataset.act];if(fn){e.preventDefault();fn(a.dataset,a,e)}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();FORMS[f.dataset.form]&&FORMS[f.dataset.form](new FormData(f),f)});
document.addEventListener('change',e=>{const t=e.target,f=t.form;if(!f)return;
  if(f.dataset.form==='tx'&&t.name==='type'){const x=t.value==='xfer';$('#tx-cats').hidden=x;$('#tx-tow').hidden=!x;$('#tx-acl').textContent=x?'從':'帳戶';if(!x)$('#tx-cats').innerHTML=catChips(t.value)}
  if(f.dataset.form==='rec'&&t.name==='freq')$('#rc-mw').hidden=t.value!=='yearly';
  if(f.dataset.form==='rec'&&t.name==='kind'){$('#rc-cat').value=t.value==='in'?'薪資':'居住'}
  if(f.dataset.form==='decide'){syncDf();if(t.name==='mode')$('#d-inst').hidden=t.value!=='inst'}});
document.addEventListener('input',e=>{if(e.target.form&&e.target.form.id==='dform')syncDf();if(e.target.id==='qIn'){S.qparse=parseAll(e.target.value);renderQPrev()}});
document.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('qsel')){const it=S.qparse[+t.dataset.qi];if(it)it[t.dataset.qf]=t.value}});
$('#receiptFile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)readReceipt(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
$('#importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.core)throw 0;
  const old=Object.keys(S.months);S.core=normCore(d.core);S.months=d.months||{};new Set([...old,...Object.keys(S.months)]).forEach(saveMonth);saveCore();closeSheet();render();toast('備份已匯入')}catch(err){toast('這不是有效的備份檔')}};r.readAsText(file);e.target.value=''});

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  $('#ttl').textContent=TITLES[S.tab];
  $('#syncNote').textContent='錢途・資料只在這支裝置';
  if(!S.ready)return;
  const v={home:vHome,ledger:vLedger,assets:vAssets,decide:vDecide,advisor:vAdvisor}[S.tab];
  $('#view').innerHTML=v();
}

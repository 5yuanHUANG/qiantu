<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>錢途</title>
<meta name="description" content="個人財務副駕：現金流、信用卡、安全可支配金額與消費決策">
<meta name="theme-color" content="#EDF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="錢途">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}.app{overflow-x:clip}body{touch-action:manipulation}img{max-width:100%}[hidden]{display:none!important}
/* Layout: single phone column, sticky header, fixed bottom tab bar; ledger-paper neutrals with a deep jade accent. Taiwan convention: red = 漲, green = 跌 */
:root{
  --bg:#EDF1EF;--surface:#FFFFFF;--surface2:#F5F8F6;--ink:#13201C;--muted:#5D6B67;--line:#D7DFDC;
  --accent:#1C5A50;--accent-ink:#FFFFFF;--accent-soft:#DAEAE4;
  --up:#C3362B;--down:#1C8549;--warn:#9A6210;--warn-soft:#F6E9D2;--bad-soft:#F7DFDB;--ok-soft:#DCEFE2;
  --shadow:0 1px 2px rgba(19,32,28,.05),0 6px 18px rgba(19,32,28,.06);
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --bar:rgba(255,255,255,.55);--bar-bg:rgba(237,241,239,.62);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412;--surface:#161F1C;--surface2:#1B2622;--ink:#E4ECE9;--muted:#91A09B;--line:#28332F;
  --accent:#72C6B3;--accent-ink:#0B1714;--accent-soft:#1D3530;
  --up:#F06A5F;--down:#52C386;--warn:#E3AA4E;--warn-soft:#3A2E18;--bad-soft:#3C1F1C;--ok-soft:#183324;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--bar:rgba(30,42,38,.55);--bar-bg:rgba(14,20,18,.62);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412;--surface:#161F1C;--surface2:#1B2622;--ink:#E4ECE9;--muted:#91A09B;--line:#28332F;
  --accent:#72C6B3;--accent-ink:#0B1714;--accent-soft:#1D3530;
  --up:#F06A5F;--down:#52C386;--warn:#E3AA4E;--warn-soft:#3A2E18;--bad-soft:#3C1F1C;--ok-soft:#183324;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--bar:rgba(30,42,38,.55);--bar-bg:rgba(14,20,18,.62);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:var(--bar-bg);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(24px) saturate(200%);margin-inline:-16px;padding-inline:16px;display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;gap:12px}
header.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.2}
header.top .sub{font-size:12px;color:var(--muted)}
.brand{display:flex;align-items:center;gap:10px}.brand img{border-radius:9px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
#view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px}
.label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.big{font-size:34px;font-weight:700;line-height:1.08;letter-spacing:-.02em}
.mid{font-size:20px;font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px;min-width:0}
.stat .v{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.hero{background:var(--accent);color:var(--accent-ink)}
.hero .label,.hero .hint{color:inherit;opacity:.85}
.hero .stat{background:rgba(255,255,255,.12)}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}.pos{color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding-block:11px;border-bottom:1px solid var(--line);min-width:0}
.item[data-act]{cursor:pointer}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s.wrap{white-space:normal}
.item .t.wrap{white-space:normal;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.item .amt{font-weight:600;text-align:right;white-space:nowrap}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.tag.est{border-style:dashed}
.tag.bad{background:var(--bad-soft);color:var(--up);border-color:transparent}
.tag.mid{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--down);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 12px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--down)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--up)}
.alert{display:flex;gap:10px;padding:12px;border-radius:14px;font-size:14px;align-items:flex-start}
.alert.bad{background:var(--bad-soft)}.alert.mid{background:var(--warn-soft)}.alert.ok{background:var(--ok-soft)}.alert.info{background:var(--accent-soft)}
.alert b{display:block}
.sym{font-weight:700;flex:none;width:16px;text-align:center}
.alert.bad .sym{color:var(--up)}.alert.mid .sym{color:var(--warn)}.alert.ok .sym{color:var(--down)}.alert.info .sym{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--up)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button,.seg label{flex:1 0 auto;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-size:14px;cursor:pointer;white-space:nowrap;text-align:center;color:var(--muted)}
.seg button.on,.seg input:checked+span{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.seg label{padding:0}.seg label span{display:block;padding:8px 10px;border-radius:9px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px}
.chips input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
form .f{display:flex;flex-direction:column;gap:5px;min-width:0}
form .f>span{font-size:13px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:12px}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:10px 12px;min-height:44px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
/* iPhone: inputs under 16px trigger auto-zoom; date inputs carry an intrinsic min width */
input,select,textarea{font-size:16px;max-width:100%;min-width:0}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;line-height:1.3}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left}
.grid2>*,.grid3>*,.row>*{min-width:0}
.kv span{min-width:0;overflow-wrap:anywhere}
.qbar input{min-width:0}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin-top:2px}
.amount-in{font-family:var(--f-num);font-size:28px;font-weight:600;text-align:right}
.hint{font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);background:var(--bar);-webkit-backdrop-filter:blur(24px) saturate(200%);backdrop-filter:blur(24px) saturate(200%);border-top:.5px solid var(--line);box-shadow:0 -1px 0 rgba(255,255,255,.06) inset;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{position:relative;border:0;background:transparent;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--up);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(19,32,28,.25);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}
/* Press feedback on touch-down */
.btn,.icon-btn,.fab,.quickbar,.item[data-act],.seg button,nav.tabs button,.sugg{transition:transform 120ms ease-out,background-color 120ms ease-out,opacity 120ms ease-out}
.btn:active,.icon-btn:active,.quickbar:active{transform:scale(.97)}
.fab:active{transform:scale(.92)}
.btn:active{opacity:.88}
.item[data-act]{margin-inline:-8px;padding-inline:8px;border-radius:12px}
.item[data-act]:active,details.why summary:active{background:var(--surface2)}
nav.tabs button:active,.seg button:active{opacity:.55}
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-back{position:absolute;inset:0;background:rgba(8,14,12,.45);opacity:0}
.sheet-panel{position:relative;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;overscroll-behavior:contain;width:100%;max-width:560px;margin:0 auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translate3d(0,100%,0);will-change:transform;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.sheet-panel .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px;touch-action:none}
.sheet-panel h3{margin:0 0 12px;font-size:18px}
@keyframes toastIn{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#toast:not([hidden]){animation:toastIn 220ms cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){#toast:not([hidden]){animation:none}.btn:active,.icon-btn:active,.quickbar:active,.fab:active{transform:none}}
@media (prefers-reduced-transparency: reduce){header.top{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}nav.tabs{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast: more){:root{--line:#8A9894}.card,.sugg,.stat{border:1px solid var(--line)}nav.tabs{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
#toast{display:flex;gap:14px;align-items:center;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.toast-undo{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
.quickbar{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.quickbar span{flex:1;color:var(--muted)}
.quickbar b{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;line-height:1}
.qbar{display:flex;gap:8px}.qbar input{flex:1;font-size:17px}
.qsel{width:auto!important;max-width:100%;min-height:34px!important;padding:3px 6px!important;font-size:16px;border-radius:8px!important}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-num)}
.c-line{fill:none;stroke:var(--accent);stroke-width:2}
.c-area{fill:var(--accent);fill-opacity:.12}
.c-zero{stroke:var(--up);stroke-dasharray:3 3;stroke-width:1}
.c-grid{stroke:var(--line);stroke-width:1}
.c-min{fill:var(--up)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding-block:3px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600}
.kv.total{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.ai-out{font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.ai-out h4{margin:14px 0 4px;font-size:15px}
.ai-out p{margin:6px 0}
.ai-out ul{margin:4px 0;padding-left:20px}
.msg{padding:10px 12px;border-radius:14px;max-width:88%;font-size:14px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.ai{align-self:flex-start;background:var(--surface2)}
.chat{display:flex;flex-direction:column;gap:8px}
.daygroup{font-size:12px;color:var(--muted);padding-top:12px;display:flex;justify-content:space-between}
.empty{text-align:center;padding:22px 8px;color:var(--muted);font-size:14px}
.overflow{overflow-x:auto}
table.t{width:100%;font-size:13px;border-collapse:collapse}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:500}
details.why summary{cursor:pointer;font-size:13px;color:var(--accent);margin-top:6px}
details.why .kv{font-size:13px}
.sugg{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sugg .h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.sugg .h b{font-size:15px}
.isel{width:auto!important;max-width:100%;min-height:34px!important;padding:3px 6px!important;font-size:16px;border-radius:8px!important}
.dchip{font:inherit;font-size:13px;min-height:34px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.dchip.p{background:var(--surface2)}.dchip.f{border-style:dashed;color:var(--muted)}.dchip.l{color:var(--muted);text-decoration:line-through}.dchip.m{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="34" height="34"><div><h1 id="ttl">首頁</h1><div class="sub" id="syncNote">錢途</div></div></div>
    <button class="icon-btn" data-act="settings" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="view"><div class="card empty">讀取中…</div></main>
</div>

<button class="fab" data-act="quick" aria-label="記一筆"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs"><div class="in">
  <button data-act="tab" data-t="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>首頁</button>
  <button data-act="tab" data-t="txs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>交易<span class="badge" id="pendBadge" hidden></span></button>
  <button data-act="tab" data-t="flow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l5-6 4 3 6-8 3 3"/><path d="M3 21h18"/></svg>現金流</button>
  <button data-act="tab" data-t="accts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2M7 6V4h10v2"/></svg>帳戶卡片</button>
  <button data-act="tab" data-t="advisor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg>顧問</button>
</div></nav>

<div id="sheet" class="sheet" hidden><div class="sheet-back" data-act="closeSheet"></div><div class="sheet-panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="receiptFile" accept="image/*" hidden>

<script>
"use strict";
/* ================= constants ================= */
const CAT_OUT=['餐飲','交通','居住','日用','購物','數位工具','運動','娛樂','醫療','教育','保險','稅費','社交','旅遊','3C','寵物','貸款','手續費','其他'];
const CAT_IN=['薪資','獎金','股利','利息','副業','其他收入'];
const KIND={expense:'支出',income:'收入',refund:'退款',transfer:'轉帳',card_payment:'繳卡費',invest_buy:'買股',invest_sell:'賣股'};
const ACC_K={bank:'銀行',cash:'現金',ewallet:'電子支付',broker:'證券交割戶'};
const TITLES={home:'首頁',txs:'交易',flow:'現金流',accts:'帳戶卡片',advisor:'顧問'};
const TAGR=[['AI',/claude|chatgpt|chatllm|openai|gpt|gemini|cursor|copilot|perplexity|midjourney|\bai\b/i,'數位工具'],['羽球',/羽球|羽毛球/,'運動'],['跳舞',/跳舞|舞蹈|街舞|國標/,'運動'],['捷運',/捷運|mrt/i,'交通'],['自行車',/youbike|ubike/i,'交通'],['訂閱',/訂閱|netflix|spotify|icloud|disney|youtube premium|google one/i,null],['儲值',/加值|儲值/,null]];
const KW={餐飲:['早餐','午餐','晚餐','宵夜','早午餐','下午茶','咖啡','飲料','手搖','珍奶','便當','麥當勞','肯德基','星巴克','路易莎','7-11','全家','萊爾富','火鍋','燒肉','拉麵','麵','飯','餐','吃','點心','零食','水果','外送','foodpanda','ubereats'],
 交通:['悠遊卡','一卡通','公車','計程車','小黃','uber','高鐵','台鐵','火車','客運','加油','油錢','停車','etag'],日用:['全聯','家樂福','好市多','costco','屈臣氏','康是美','衛生紙','洗衣','電信','電話費','水費','電費','瓦斯'],
 購物:['蝦皮','momo','pchome','淘寶','衣服','褲','鞋','uniqlo','zara','網購'],運動:['球場','健身','瑜珈','游泳','球拍','羽球','跳舞'],數位工具:['app','訂閱','icloud'],娛樂:['電影','遊戲','switch','steam','ktv','演唱會','展覽'],
 醫療:['看診','掛號','藥','牙醫','醫院','診所'],居住:['房租','租金','管理費'],教育:['書','課程','學費','補習','英文'],保險:['保險','保費'],社交:['聚餐','聚會','禮金','紅包','請客','送禮','禮物','喜酒'],旅遊:['住宿','飯店','民宿','旅行','機票','門票'],'3C':['手機','耳機','電腦','平板','充電','iphone','ipad'],寵物:['飼料','貓砂','寵物','獸醫'],稅費:['稅','罰單','規費'],手續費:['手續費','跨行']};
const KW_IN={薪資:['薪水','薪資','月薪'],獎金:['獎金','年終','分紅'],股利:['股利','股息','配息'],利息:['利息'],副業:['接案','外快','稿費','兼職']};

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round((+x||0)*100)/100;
const num=v=>{const n=parseFloat(String(v??'').replace(/[,\s$]/g,''));return isFinite(n)?n:0};
const sum=(a,f=x=>x)=>r2(a.reduce((s,x)=>s+(+f(x)||0),0));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const dim=(y,m)=>new Date(y,m,0).getDate();
const dayIn=(y,m,day)=>{const d=new Date(y,m-1,1);const Y=d.getFullYear(),M=d.getMonth()+1;return Y+'-'+pad(M)+'-'+pad(Math.min(day,dim(Y,M)))};
function nextMonthDay(from,day,strict){const[y,m]=from.split('-').map(Number);for(let k=0;k<3;k++){const c=dayIn(y,m+k,day);if(strict?c>from:c>=from)return c}return null}
const monthEnd=ym=>{const[y,m]=ym.split('-').map(Number);return ym+'-'+pad(dim(y,m))};
const shiftMonth=(ym,k)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'—';
const wk=s=>'日一二三四五六'[parseD(s).getDay()];
const mLabel=m=>`${+m.slice(0,4)}年${+m.slice(5,7)}月`;
let TODAY=null;
function todayStr(){if(TODAY)return TODAY;try{return new Intl.DateTimeFormat('en-CA',{timeZone:(DB&&DB.settings.tz)||'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return ymd(new Date())}}
function fmt(n,cur){n=+n||0;const f=cur&&cur!=='TWD';return(n<0?'−':'')+(f?cur+' ':'$')+Math.abs(n).toLocaleString('zh-TW',{maximumFractionDigits:f?2:0})}
function fmtS(n){const a=Math.abs(n),s=n<0?'−':'';if(a>=1e8)return s+(a/1e8).toFixed(2)+'億';if(a>=1e4)return s+(a/1e4).toFixed(a>=1e6?0:1)+'萬';return s+Math.round(a).toLocaleString('zh-TW')}
function toast(t,undoable){const el=$('#toast');el.innerHTML='';const sp=document.createElement('span');sp.textContent=t;el.append(sp);if(undoable){const b=document.createElement('button');b.className='toast-undo';b.textContent='復原';b.onclick=()=>{el.hidden=true;undo()};el.append(b)}el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,undoable?6000:2600)}

/* ================= store ================= */
const KEY='qt2:db';
let DB=null;const UNDO=[];
function defDB(){return{v:2,settings:{startDate:'',tz:'Asia/Taipei',fx:{USD:{rate:32,date:'',est:true}},reserve:0,reserveSet:false,horizon:'payday',scenario:'cash',watchTags:['AI','運動'],reportBasis:'event',emMonths:6,ret:6,hours:176,aiOn:true,staleDays:14,lastBackup:'',defPay:'',defCard:''},
  accounts:[],cards:[],txs:[],recurring:[],occ:{},holdings:[],holdDate:'',policies:[],liabilities:[],assets:[],goals:[],decisions:[],recon:[],dismissed:{},audit:[],rules:[],imports:[],courses:[],snaps:[],brokerCash:[],owed:{}}}
function normDB(d){const D=defDB();const o={...D,...d};o.settings={...D.settings,...(d.settings||{})};o.settings.fx={...D.settings.fx,...((d.settings||{}).fx||{})};for(const k of Object.keys(D))if(Array.isArray(D[k])&&!Array.isArray(o[k]))o[k]=[];for(const k of['occ','dismissed','owed'])if(!o[k]||typeof o[k]!=='object')o[k]={};return o}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));return true}catch(e){toast('儲存失敗，手機空間可能不足，請先匯出備份');return false}}
function commit(label,fn,opts={}){const snap=JSON.stringify(DB);try{fn()}catch(e){DB=JSON.parse(snap);console.error(e);toast('發生錯誤，沒有變更任何資料');return false}UNDO.push(snap);if(UNDO.length>20)UNDO.shift();DB.audit.push({ts:Date.now(),a:label});if(DB.audit.length>300)DB.audit.splice(0,DB.audit.length-300);save();render();if(opts.toast)toast(opts.toast,true);return true}
function undo(){const s=UNDO.pop();if(!s)return toast('沒有可以復原的操作');DB=JSON.parse(s);save();render();toast('已復原')}
function readV1(){try{const c=localStorage.getItem('fp:core');if(!c)return null;const months={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('fp:tx-'))months[k.slice(6)]=(JSON.parse(localStorage.getItem(k))||{}).items||[]}return{core:JSON.parse(c),months}}catch(e){return null}}

/* v1 → v2 migration: balances become the starting snapshot; card balances become unbilled charges */
function remapCat(name,cat,kind){const {tags,cat:c2}=autoTags(name);if(kind==='income')return{cat:CAT_IN.includes(cat)?cat:'其他收入',tags};
  if(c2)return{cat:c2,tags};if(/icloud|google one|dropbox/i.test(name))return{cat:'數位工具',tags:[...tags,'雲端']};if(/電話|電信/.test(name))return{cat:'日用',tags:['電信']};
  if(cat==='日常雜支')return{cat:'日用',tags};if(cat==='副業')return{cat:'其他',tags};return{cat:CAT_OUT.includes(cat)?cat:'其他',tags}}
function migrateV1(v1,asOf){
  const c=v1.core||{},d=defDB(),t=asOf||todayStr(),at=Date.now();
  d.settings.startDate=t;d.settings.fx.USD={rate:+(c.settings&&c.settings.usd)||32,date:t,est:true};
  for(const k of['emMonths','ret','hours','lastBackup'])if(c.settings&&c.settings[k]!=null)d.settings[k]=c.settings[k];
  const src=c.accounts||[];
  for(const a of src.filter(a=>a.type!=='credit'&&a.type!=='property')){const usd=/美金|美元|usd/i.test(a.name);
    d.accounts.push({id:a.id,name:a.name,kind:a.type==='cash'?'cash':a.type==='ewallet'?'ewallet':'bank',cur:usd?'USD':'TWD',purpose:usd?'外幣儲蓄':'',inAvail:!usd,minKeep:0,balance:r2(a.balance),balanceDate:t,balanceAt:at,archived:false})}
  for(const a of src.filter(a=>a.type==='property'))d.assets.push({id:a.id,name:a.name,value:r2(a.balance),date:t});
  const banks=d.accounts.filter(a=>a.kind==='bank'&&a.cur==='TWD');
  for(const a of src.filter(a=>a.type==='credit')){const b=banks.find(x=>a.name.startsWith(x.name))||banks[0];
    d.cards.push({id:a.id,name:a.name,last4:'',closeDay:null,dueDay:a.payDay||null,debitAcct:b?b.id:'',autopay:'unknown',stmt:null,unbilledBase:r2(Math.max(0,-(+a.balance||0))),unbilledAsOf:t,unbilledAt:at,archived:false})}
  d.holdings=(c.holdings||[]).map(h=>({id:h.id,symbol:h.symbol,name:h.name||'',mkt:h.mkt||'tw',cur:h.cur||'TWD',shares:+h.shares||0,cost:+h.cost||0,price:+h.price||0}));d.holdDate=d.holdings.length?t:'';
  for(const r of c.recurring||[]){const kind=r.kind==='in'?'income':'expense';const m=remapCat(r.name,r.cat,kind);
    const pay=(r.acct&&(d.accounts.some(a=>a.id===r.acct)||d.cards.some(x=>x.id===r.acct)))?r.acct:'';
    const R={id:r.id,name:r.name,kind,amount:r2(r.amount),amountType:kind==='income'&&r.cat==='薪資'?'variable':'fixed',isSalary:kind==='income'&&r.cat==='薪資',freq:r.freq==='yearly'?'yearly':'monthly',day:+r.day||1,month:+r.month||1,weekday:1,start:'',end:r.until||'',payWith:pay,cat:m.cat,tags:m.tags,paused:false};
    if(kind==='expense'&&/儲蓄險|壽險|保單/.test(r.name)){const p={id:uid(),name:r.name,purpose:/儲蓄/.test(r.name)?'儲蓄':'',premium:R.amount,freq:R.freq,payEnd:R.end,surrender:null,surrenderDate:'',maturity:'',loan:0,note:''};d.policies.push(p);R.policyId=p.id;R.cat='保險'}
    if(kind==='expense'&&(r.cat==='貸款'||/房貸|車貸|信貸/.test(r.name))){const l={id:uid(),name:r.name,balance:null,rate:null,payment:R.amount,date:''};d.liabilities.push(l);R.liabId=l.id;R.cat='貸款'}
    d.recurring.push(R)}
  for(const L of c.loans||[])d.liabilities.push({id:L.id||uid(),name:L.name,balance:null,rate:+L.rate||null,payment:null,date:'',note:`原貸 ${L.principal}、${L.years} 年、撥款 ${L.start}`});
  d.goals=(c.goals||[]).map(g=>({...g}));d.decisions=c.decisions||[];
  for(const[m,items]of Object.entries(v1.months||{}))for(const x of items){const isCardTo=d.cards.some(k=>k.id===x.to);const kind=x.type==='in'?'income':x.type==='xfer'?(isCardTo?'card_payment':'transfer'):'expense';const mm=remapCat(x.note||x.cat,x.cat,kind);
    d.txs.push({id:x.id,kind,amount:r2(x.amount),cur:'TWD',date:x.date,acct:x.acct,to:x.to||'',merchant:x.note||'',cat:kind==='expense'?mm.cat:kind==='income'?mm.cat:'',tags:mm.tags,source:'v1',confirm:'confirmed',occur:'occurred',note:'',ts:Math.min(x.ts||0,at-1)})}
  d.audit.push({ts:at,a:'從舊版搬移資料'});d.migratedFromV1=t;return d}

/* ================= lookups ================= */
const acc=id=>DB.accounts.find(a=>a.id===id);
const card=id=>DB.cards.find(c=>c.id===id);
const srcName=id=>{const a=acc(id)||card(id);return a?a.name:'未指定'};
const liveAccts=()=>DB.accounts.filter(a=>!a.archived);
const liveCards=()=>DB.cards.filter(c=>!c.archived);
const rate=cur=>!cur||cur==='TWD'?1:(+((DB.settings.fx[cur]||{}).rate)||0);
const toTWD=(v,cur)=>r2((+v||0)*rate(cur));
const curOf=id=>{const a=acc(id);return a?a.cur:'TWD'};

/* ================= engine: balances ================= */
const counted=t=>t.confirm==='confirmed'&&t.occur==='occurred';
// a snapshot (balance at date/at) already contains everything up to that moment
const afterBase=(t,date,at)=>t.date>date||(t.date===date&&(t.ts||0)>(at||0)&&t.source!=='import');
function acctDelta(t,id){const A=+t.amount||0;switch(t.kind){
  case'expense':case'invest_buy':case'card_payment':return t.acct===id?-A:0;
  case'income':case'invest_sell':case'refund':return t.acct===id?A:0;
  case'transfer':return(t.acct===id?-A:0)+(t.to===id?(t.toAmount!=null&&t.toAmount!==''?+t.toAmount:A):0)}return 0}
function inBaseline(t,a){return!!t.baseIncluded||!afterBase(t,a.balanceDate,a.balanceAt)}
function acctBal(a){let b=+a.balance||0;for(const t of DB.txs){if(!counted(t)||t.baseIncluded)continue;const d=acctDelta(t,a.id);if(d&&afterBase(t,a.balanceDate,a.balanceAt))b+=d}return r2(b)}
function cardState(c){const sb=c.stmt;const pBase=sb?sb.closeDate:c.unbilledAsOf,pAt=sb?sb.at:c.unbilledAt;let unb=+c.unbilledBase||0,pays=0;
  for(const t of DB.txs){if(!counted(t)||t.baseIncluded)continue;
    if((t.kind==='expense'||t.kind==='refund')&&t.acct===c.id&&afterBase(t,c.unbilledAsOf,c.unbilledAt))unb+=t.kind==='expense'?+t.amount:-t.amount;
    if(t.kind==='card_payment'&&t.to===c.id&&afterBase(t,pBase,pAt))pays+=+t.amount}
  let rem=sb?(+sb.amount)-(+sb.paidBase||0)-pays:0;if(!sb)unb-=pays;if(rem<0){unb+=rem;rem=0}
  return{stmtRem:r2(rem),unbilled:r2(unb),debt:r2(rem+unb),pays:r2(pays),stmt:sb}}
function closeDayOf(c){if(c.closeDay)return{d:+c.closeDay,assumed:false};if(c.dueDay){let d=+c.dueDay-15;if(d<1)d+=30;return{d,assumed:true}}return null}
function closesBetween(c,a,b){const cd=closeDayOf(c);if(!cd)return[];const out=[];let x=a;for(let i=0;i<24;i++){const n=nextMonthDay(x,cd.d,true);if(!n||n>b)break;out.push(n);x=n}return out}
const dueAfter=(c,close)=>c.dueDay?nextMonthDay(close,+c.dueDay,true):addDays(close,15);
function stmtEstimate(c,D){let e=+c.unbilledBase||0;for(const t of DB.txs){if(!counted(t)||t.baseIncluded||t.acct!==c.id)continue;if((t.kind==='expense'||t.kind==='refund')&&afterBase(t,c.unbilledAsOf,c.unbilledAt)&&t.date<=D)e+=t.kind==='expense'?+t.amount:-t.amount}return r2(e)}
function pendingStmts(){const t=todayStr(),out=[];for(const c of liveCards()){if(!c.closeDay)continue;const last=c.stmt?c.stmt.closeDate:c.unbilledAsOf;const cl=closesBetween(c,last,t);if(cl.length){const D=cl[cl.length-1];out.push({c,close:D,due:dueAfter(c,D),est:stmtEstimate(c,D)})}}return out}
function applyStmt(c,close,amount,paidBase){c.stmt={amount:r2(amount),closeDate:close,dueDate:dueAfter(c,close),paidBase:r2(paidBase||0),at:Date.now()};c.unbilledBase=0;c.unbilledAsOf=close;c.unbilledAt=Number.MAX_SAFE_INTEGER}

/* ================= engine: recurring ================= */
const okey=(r,d)=>r.id+'|'+d;
const recEnd=r=>r.end?(r.end.length===7?monthEnd(r.end):r.end):'9999-12-31';
function recDates(r,from,to,all){const out=[];if(r.paused||(r.mode==='budget'&&!all))return out;const s=[r.start||'',DB.settings.startDate||''].sort().pop();const a=from>s?from:s;const e=recEnd(r);const b=to<e?to:e;if(!a||a>b)return out;
  if(r.freq==='weekly'){let d=a;for(let i=0;i<7&&parseD(d).getDay()!==+r.weekday;i++)d=addDays(d,1);for(;d<=b;d=addDays(d,7))out.push(d);return out}
  const[y,m]=a.split('-').map(Number);for(let i=0;i<480;i++){const c=dayIn(y,m+i,+r.day||1);if(c>b)break;if(c>=a&&(r.freq!=='yearly'||+c.slice(5,7)===+r.month))out.push(c)}return out}
function upcomingThisMonth(){const t=todayStr(),out=[];const end=[monthEnd(t.slice(0,7)),addDays(t,14)].sort().pop();for(const r of DB.recurring)if(r.kind==='expense')for(const d of recDates(r,addDays(t,1),end))if(!DB.occ[okey(r,d)])out.push({r,d});return out.sort((a,b)=>a.d.localeCompare(b.d))}
function pendingRec(){const t=todayStr(),out=[];for(const r of DB.recurring)for(const d of recDates(r,DB.settings.startDate||t,t))if(!DB.occ[okey(r,d)])out.push({r,d});return out.sort((a,b)=>a.d.localeCompare(b.d))}
function defIncomeAcct(){const a=liveAccts();return(a.find(x=>x.kind==='bank'&&x.cur==='TWD')||a[0]||{}).id}
function confirmOcc(r,d,amount,date,pay,base){if(DB.owed)delete DB.owed[okey(r,d)];const p=pay||r.payWith||defIncomeAcct();const tx={id:uid(),kind:r.kind==='income'?'income':'expense',amount:r2(amount),cur:card(p)?'TWD':curOf(p),date:date||d,acct:p,to:'',merchant:r.name,cat:r.cat,tags:[...(r.tags||[])],source:'recurring',confirm:'confirmed',occur:'occurred',rec:{id:r.id,d},note:'',baseIncluded:!!base,ts:Date.now()};DB.txs.push(tx);DB.occ[okey(r,d)]={s:'done',tx:tx.id};return tx}
function removeTx(id){const i=DB.txs.findIndex(t=>t.id===id);if(i<0)return;const t=DB.txs[i];DB.txs.splice(i,1);if(t.rec){const k=t.rec.id+'|'+t.rec.d;if(DB.occ[k]&&DB.occ[k].tx===id)delete DB.occ[k]}if(t.course){const c=DB.courses.find(x=>x.id===t.course);if(c&&c.payTx===id){c.paid=false;c.payTx='';c.payDate=''}}}
function nextPayday(){const t=todayStr();let best=null;for(const r of DB.recurring){if(r.kind!=='income'||!r.isSalary)continue;for(const d of recDates(r,addDays(t,1),addDays(t,75)))if(!DB.occ[okey(r,d)]){if(!best||d<best.date)best={date:d,r};break}}return best}
function horizonEnd(h){const t=todayStr();h=h||DB.settings.horizon;if(h==='payday'){const p=nextPayday();return p?p.date:addDays(t,30)}return addDays(t,+h||30)}
const horizonLabel=end=>{const p=nextPayday();return p&&p.date===end?`到 ${md(end)} 發薪`:`到 ${md(end)}（${dayDiff(todayStr(),end)} 天）`};

/* ================= engine: projection ================= */
function project(o={}){
  const t=todayStr(),end=o.end||addDays(t,30),inc=!!o.income;const bal={};for(const a of liveAccts())bal[a.id]=acctBal(a);
  const start={...bal},evs=[],cAdd={},notes=[],later=[];const defIn=defIncomeAcct();
  const push=(date,acct,delta,label,x={})=>{if(date>end)return;evs.push({date:date<t?t:date,orig:date,acct,delta:r2(delta),label,overdue:date<t,...x})};
  for(const r of DB.recurring)for(const d of recDates(r,DB.settings.startDate||t,end)){if(DB.occ[okey(r,d)])continue;

function analyze(df){const price=num(df.price);if(!(price>0))return null;const t=todayStr();const date=df.date&&df.date>=t?df.date:t;const pay=df.pay||defaultPay();const isCard=!!card(pay);
  const n=df.inst?Math.max(2,Math.round(num(df.n)||12)):1;const fee=df.inst&&df.feeKnown?num(df.fee):0;const per=r2((price+fee)/n);
  const extra=[];if(df.inst){for(let i=0;i<n;i++)extra.push({date:i===0?date:dayIn(+date.slice(0,4),+date.slice(5,7)+i,+date.slice(8)),acct:pay,delta:-per,label:`${df.item||'這筆消費'} 分期 ${i+1}/${n}`})}else extra.push({date,acct:pay,delta:-price,label:df.item||'這筆消費'});
  const end=[horizonEnd(),addDays(date,isCard?50:1)].sort().pop();const B=safeSpend(end),A=safeSpend(end,extra);
  const newShort=A.pf.short.filter(s=>!B.pf.short.some(b=>b.acct===s.acct));const newShortC=A.pc.short.filter(s=>!B.pc.short.some(b=>b.acct===s.acct));
  const missing=[];if(df.inst&&!df.feeKnown)missing.push('分期手續費或利率還不確定');for(const x of dataIssues().filter(x=>x.lv==='high'))missing.push(x.text);
  const reserveHit=A.cashBasis<0&&B.cashBasis>=0?Math.min(B.reserve,-A.cashBasis):A.cashBasis<0?Math.min(B.reserve,-A.cashBasis):0;
  const goals=DB.goals.filter(g=>(+g.target||0)>(+g.saved||0));const fixed=monthlyFixed();
  let v,vt;if(newShort.length||A.future<0){v='no';vt='現在不建議'}else if(A.cashBasis<0){v='wait';vt='要等收入入帳後才付得起'}else if(df.need==='want'&&price>Math.max(0,B.cashBasis)*0.3){v='wait';vt='付得起，但建議冷靜 30 天'}else{v='go';vt='負擔得起'}
  if(df.need==='must'&&v==='wait'&&!newShort.length)vt='必要支出：付得起，但要注意時間點';if(df.inst&&!df.feeKnown&&v==='go'){v='ok';vt='先確認分期費用再決定'}
  return{price,date,pay,isCard,n,fee,per,end,B,A,newShort,newShortC,missing,reserveHit:r2(reserveHit),goals,fixed,v,vt}}

function aiBox(id,text,busy,act,label,blurb){if(!DB.settings.aiOn)return'<div class="hint">AI 已在設定中關閉。</div>';if(!S.ai)return'<div class="hint">到「設定」輸入 Claude API 金鑰即可使用。</div><button class="btn ghost sm" data-act="settings" style="margin-top:8px">前往設定</button>';

function md2(t){const lines=esc(t).split('\n');let o='',ul=false;const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');const close=()=>{if(ul){o+='</ul>';ul=false}};for(const l of lines){let m;if((m=l.match(/^\s*#{1,4}\s+(.*)/))){close();o+=`<h4>${inl(m[1])}</h4>`}else if((m=l.match(/^\s*(?:[-*•]|\d+[.)、])\s+(.*)/))){if(!ul){o+='<ul>';ul=true}o+=`<li>${inl(m[1])}</li>`}else{close();if(l.trim())o+=`<p>${inl(l)}</p>`}}close();return o}

/* ---------- AI (own API key) ---------- */
const AI_MODEL='claude-opus-5-5';
const getKey=()=>{try{return localStorage.getItem('qt:apikey')||''}catch(e){return''}};
let SDK=null;async function loadSDK(){if(!SDK)SDK=(await import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm')).default;return SDK}
async function toImageBlock(file){const bmp=await createImageBitmap(file);const k=Math.min(1,1568/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return{type:'image',source:{type:'base64',media_type:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]}}}
function aiError(e,text){const A=SDK;if(A&&e instanceof A.APIUserAbortError)return{code:'cancelled',text};if(A&&(e instanceof A.AuthenticationError||e instanceof A.PermissionDeniedError))return{code:'bad_key',text};if(A&&e instanceof A.RateLimitError)return{code:'rate_limited',text};if(A&&e instanceof A.APIConnectionError)return{code:'offline',text};if(e&&e.name==='AbortError')return{code:'cancelled',text};if(e&&e.code)return e;return{code:'upstream_error',text}}
function makeAI(){if(!getKey())return null;async function ask(input,opts={}){const msgs=(typeof input==='string'?[{role:'user',content:input}]:input).filter(m=>m.content);const merged=[];for(const m of msgs){const l=merged[merged.length-1];if(l&&l.role===m.role)l.content+='\n\n'+m.content;else merged.push({role:m.role,content:m.content})}
  if(opts.images){const imgs=[...(opts.images.length!=null?opts.images:[opts.images])];const l=merged[merged.length-1];l.content=[...(await Promise.all(imgs.map(toImageBlock))),{type:'text',text:l.content}]}let text='';
  try{const Anthropic=await loadSDK();const client=new Anthropic({apiKey:getKey(),dangerouslyAllowBrowser:true});const stream=client.beta.messages.stream({model:AI_MODEL,max_tokens:16000,thinking:{type:'adaptive'},output_config:{effort:'medium'},betas:['server-side-fallback-2026-07-01'],fallbacks:'default',messages:merged},{signal:opts.signal});
    stream.on('text',d=>{text+=d;if(opts.onText)opts.onText({text})});const msg=await stream.finalMessage();if(msg.stop_reason==='refusal')throw{code:'refused'};const full=msg.content.filter(b=>b.type==='text').map(b=>b.text).join('');if(!full.trim())throw{code:'empty'};return{text:full}}catch(e){throw aiError(e,text)}}
  ask.json=async(input,opts)=>{const r=await ask(input,opts);const m=r.text.match(/[\[{][\s\S]*[\]}]/);try{return JSON.parse(m?m[0]:r.text)}catch(e){throw{code:'invalid_json',text:r.text}}};return ask}
function aiErr(e){return{bad_key:'API 金鑰無效或沒有權限，請到設定重新輸入。',rate_limited:'使用太頻繁或額度不足，請稍後再試。',offline:'沒有網路連線。',refused:'AI 無法回答這個問題，換個方式問問看。',invalid_json:'AI 回傳的格式看不懂，請再試一次。'}[e&&e.code]||'AI 暫時無法回應，請再試一次。'}
function snapText(){const S1=safeSpend(),w=worth(),t=todayStr();const L=[];L.push(`今天 ${t}（台灣時間，新台幣）。開始管理日 ${DB.settings.startDate}。`);
  L.push(`期間：${horizonLabel(S1.end)}。可用現金 ${fmt(S1.cash)}；期間必要付款 ${fmt(S1.required)}；安全保留金 ${fmt(S1.reserve)}${DB.settings.reserveSet?'':'（使用者尚未設定）'}；安全可支配（現金口徑）${fmt(S1.cashBasis)}；預估收入 ${fmt(S1.income)}（未入帳），含預估收入 ${fmt(S1.future)}。`);
  L.push('期間付款：'+S1.outEv.map(e=>`${md(e.date)} ${e.label} ${fmt(-e.delta)}（${srcName(e.acct)}${e.est?'，預估':''}）`).join('；'));
  L.push('帳戶：'+liveAccts().map(a=>`${a.name} ${fmt(acctBal(a),a.cur)}（${a.inAvail?'列入可用':'不列入可用'}，基準 ${a.balanceDate}）`).join('；'));
  L.push('信用卡：'+liveCards().map(c=>{const s=cardState(c);return`${c.name} 本期剩 ${fmt(s.stmtRem)}${s.stmt?'，'+s.stmt.dueDate+' 到期':''}，未出帳 ${fmt(s.unbilled)}，扣款帳戶 ${srcName(c.debitAcct)}`}).join('；'));
  L.push('固定收支：'+DB.recurring.filter(r=>recEnd(r)>=t).map(r=>`${r.name} ${r.kind==='income'?'+':'-'}${fmt(r.amount)}/${r.freq==='yearly'?'年':r.freq==='weekly'?'週':'月'}${r.amountType==='variable'?'（金額會變）':''}`).join('；'));
  L.push(`資產：存款 ${fmt(w.ac)}、投資 ${fmt(w.inv)}（${DB.holdDate||'無'} 快照）、保單解約金 ${fmt(w.pol)}；負債：卡費 ${fmt(w.cards)}、貸款 ${fmt(w.liab)}。淨資產 ${fmt(w.net)}。`);
  const acts=DB.recurring.filter(r=>r.mode);if(acts.length||DB.courses.length)L.push('活動與課程：'+[...acts.map(r=>`${r.name}（${r.mode==='budget'?'預留':'每次確認'}，約 ${fmt(r.amount)}${isBudget(r)&&+r.count!==1?'×'+r.count:''}/${r.freq==='weekly'?'週':'月'}）`),...DB.courses.filter(c=>!c.closed).map(c=>{const cs=courseState(c);return`${c.name} ${c.sessions} 堂 ${fmt(c.price)}，剩 ${cs.left} 堂，${cs.end} 上完${c.paid?'':'，尚未付款'}`})].join('；'));
  const ws=watchSpend();L.push('本月關注用途：'+ws.map(x=>`${x.w} ${fmt(x.act)}`).join('；'));
  const iss=dataIssues();if(iss.length)L.push('資料限制：'+iss.map(x=>x.text).join('；'));return L.join('\n')}
const AI_RULES='你是務實的台灣個人理財顧問。只能使用下方提供的數字，不可自行編造餘額、交易、利率、行情或使用頻率；資料不足時直接說缺什麼。依預估資料的結論要用條件式表達。尊重使用者的生活偏好，不說教。用繁體中文、台灣用語，小標題用 ## 開頭，條列為主，400 字內。\n\n【計算摘要】\n';
let aiCtl=null;
async function runAI(prompt,key,busy,elId){if(!aiOn())return;aiCtl=new AbortController();S[busy]=true;S[key]='';render();const el=()=>document.getElementById(elId);if(el())el().innerHTML='<span class="muted">思考中…</span>';
  try{const r=await S.ai(prompt,{signal:aiCtl.signal,onText:({text})=>{S[key]=text;const e=el();if(e)e.innerHTML=md2(text)}});S[key]=r.text}catch(e){S[key]=(e.text||'')+(e.code==='cancelled'?'':'\n\n'+aiErr(e))}finally{S[busy]=false;aiCtl=null;render()}}
async function askChat(q){if(!aiOn()||S.chatBusy)return;S.chat.push({role:'user',content:q});S.chat.push({role:'assistant',content:''});S.chatBusy=true;render();const turns=[{role:'user',content:AI_RULES+snapText()+'\n\n以下是使用者的問題。'},...S.chat.slice(0,-1).slice(-10)];const last=S.chat[S.chat.length-1];aiCtl=new AbortController();
  const bub=()=>{const e=document.querySelectorAll('#chat .msg.ai .ai-out');return e[e.length-1]};if(bub())bub().innerHTML='<span class="muted">思考中…</span>';
  try{const r=await S.ai(turns,{signal:aiCtl.signal,onText:({text})=>{last.content=text;const b=bub();if(b)b.innerHTML=md2(text)}});last.content=r.text}catch(e){last.content=(e.text||'')+(e.code==='cancelled'?'':'\n\n'+aiErr(e))}finally{if(!last.content.trim())S.chat.splice(-2,2);S.chatBusy=false;aiCtl=null;render()}}

function pendRows(pr){const qs=r=>(r.quick&&r.quick.length)?r.quick:null;const groups={};for(const p of pr)if(qs(p.r))(groups[p.r.id]=groups[p.r.id]||[]).push(p);let h='';

    else h+=`<div class="item"><span class="tag est">${md(p.d)}</span><div class="main" data-act="occ" data-key="${esc(k)}" style="cursor:pointer"><div class="t">${esc(p.r.name)} ${p.r.amountType==='variable'?'<span class="tag">金額會變</span>':''}</div><div class="s">${esc(srcName(p.r.payWith||defIncomeAcct()))}・預估 ${fmt(p.r.amount)}</div></div><div class="btns" style="flex:none"><button class="btn sm" data-act="occOk" data-key="${esc(k)}" aria-label="依預估確認">✓</button><button class="btn sm ghost" data-act="occSkip" data-key="${esc(k)}">沒發生</button></div></div>`}
  return h}

  occAll(){const L=pendingRec();const v=L.filter(p=>p.r.amountType==='variable');commit('批次確認',()=>{for(const p of L)if(p.r.amountType!=='variable')confirmOcc(p.r,p.d,p.r.amount)},{toast:`已確認 ${L.length-v.length} 筆${v.length?`，${v.length} 筆金額會變的請逐筆填`:''}`})},
  prepaid(){prepaidSheet()},
  occAmt(d){const[rid,day]=d.key.split('|');const r=DB.recurring.find(x=>x.id===rid);if(!r)return;const a=num(d.amt);commit('確認 '+r.name,()=>confirmOcc(r,day,a),{toast:`已記錄 ${r.name} ${md(day)} ${fmt(a)}`})},
  occAmtAll(d){const L=pendingRec().filter(p=>p.r.id===d.rid);const a=num(d.amt);if(!L.length)return;commit('批次確認',()=>{for(const p of L)confirmOcc(p.r,p.d,a)},{toast:`已確認 ${L.length} 次，每次 ${fmt(a)}`})},
  occOwe(d){commit('標記未付款',()=>{DB.owed[d.key]=true},{toast:'已標記：上過課、還沒付款'})},
  qbud(d){const r=DB.recurring.find(x=>x.id===d.id);if(!r)return;const p=(acc(r.payWith)||card(r.payWith))?r.payWith:defaultPay();closeSheet();addTxs([{id:uid(),kind:'expense',amount:r2(r.amount),cur:card(p)?'TWD':curOf(p),date:todayStr(),acct:p,to:'',merchant:r.name,cat:r.cat,tags:[...(r.tags||[])],bud:r.id,source:'quick',confirm:'confirmed',occur:'occurred',note:'',ts:Date.now()}])},
  tpl(d){if(d.k==='dance')return courseForm({name:'跳舞課',price:2000,sessions:8,weekday:1,leaveRule:'extend',paid:true,tags:['跳舞','課程']});recForm(JSON.parse(JSON.stringify(TPL[d.k])))},
  stats(){S.tab='txs';S.txTab='stats';try{history.replaceState(null,'','#txs')}catch(e){}render();scrollTo(0,0)},stPer(d){S.stPer=d.k;render()},stBasis(d){S.stBasis=d.k;render()},
  impOpen(){importSheet()},imports(){importsSheet()},rules(){rulesSheet()},
  impFile(){const v=$('#f-impsrc');S.impSrc=v?v.value:S.impSrc;$('#impFile').click()},
  impUndo(d,el){if(!el.dataset.sure){el.dataset.sure='1';el.textContent='確定撤回';return}commit('撤回匯入',()=>undoImport(d.id),{toast:'已撤回這次匯入'});importsSheet()},
  delRule(d){commit('刪除分類規則',()=>{DB.rules=DB.rules.filter(r=>r.id!==d.id)});rulesSheet()},
  newCourse(){courseForm()},editCourse(d){const c=DB.courses.find(x=>x.id===d.id);if(c)courseForm(c)},
  delCourse(d,el){if(!el.dataset.sure){el.dataset.sure='1';el.textContent='再按一次（付款紀錄會保留）';return}closeSheet();commit('刪除課程',()=>{DB.courses=DB.courses.filter(c=>c.id!==d.id)},{toast:'已刪除課程'})},
  courseDay(d){const c=DB.courses.find(x=>x.id===d.id);if(!c)return;const cur=(c.att||{})[d.d];commit('上課紀錄',()=>{c.att=c.att||{};if(cur==='l'||cur==='m')delete c.att[d.d];else c.att[d.d]='l'},{toast:cur==='l'?`${md(d.d)} 改回上課`:cur==='m'?`已移除 ${md(d.d)} 補課`:`${md(d.d)} 標記請假`})},
  courseMk(d){openSheet(`<h3>加補課</h3><form data-form="courseMk"><input type="hidden" name="id" value="${esc(d.id)}">${fDate('補課日期','date',todayStr())}<div class="hint">補課會用掉一堂。</div><button class="btn block">加入</button></form>`)},
  coursePay(d){const c=DB.courses.find(x=>x.id===d.id);if(!c)return;commit('課程付款',()=>coursePayTx(c,todayStr(),c.payWith),{toast:`已記錄付款 ${fmt(c.price)}`})},
  courseRefund(d){const c=DB.courses.find(x=>x.id===d.id);if(!c)return;openSheet(`<h3>${esc(c.name)}・退款</h3><form data-form="courseRefund"><input type="hidden" name="id" value="${c.id}"><input type="text" inputmode="decimal" name="amount" id="f-amount" class="amount-in" placeholder="0" aria-label="退款金額"><div class="grid2"><label class="f"><span>退到</span><select name="acct" id="f-acct">${srcOpts(c.payWith||defaultPay())}</select></label>${fDate('日期','date',todayStr())}</div>${fChk('課程到此結束','close',false)}<div class="hint">依你和教室談好的金額填寫，App 不會自己計算退款。</div><button class="btn block">記錄退款</button></form>`)},
  courseRenew(d){const c=DB.courses.find(x=>x.id===d.id);if(!c)return;const cs=courseState(c);courseForm({name:c.name,price:c.price,sessions:c.sessions,weekday:c.weekday,leaveRule:c.leaveRule,payWith:c.payWith,tags:c.tags,paid:false,start:firstWd(addDays(cs.end,1),c.weekday),prev:c.id})},
  holdPaste(){holdPasteSheet()},newBroker(){brokerForm()},editBroker(d){brokerForm(DB.brokerCash.find(x=>x.id===d.id))},delBroker(d){closeSheet();commit('刪除券商現金',()=>{DB.brokerCash=DB.brokerCash.filter(x=>x.id!==d.id)})},
  stmt(d){stmtSheet(d.id)},payCard(d){payCardSheet(d.id)},cardRecon(d){cardReconSheet(d.id)},
  xfer(){xferSheet()},xferPre(d){xferSheet({from:d.from,to:d.to,amt:d.amt})},recon(){reconSheet()},
  newHold(){holdForm()},editHold(d){holdForm(DB.holdings.find(h=>h.id===d.id))},delHold(d){closeSheet();commit('刪除持股',()=>{DB.holdings=DB.holdings.filter(h=>h.id!==d.id)})},prices(){pricesSheet()},
  newPolicy(){policyForm()},editPolicy(d){policyForm(DB.policies.find(p=>p.id===d.id))},delPolicy(d){closeSheet();commit('刪除保單',()=>{DB.policies=DB.policies.filter(p=>p.id!==d.id)})},
  newLiab(){liabForm()},editLiab(d){liabForm(DB.liabilities.find(l=>l.id===d.id))},delLiab(d){closeSheet();commit('刪除負債',()=>{DB.liabilities=DB.liabilities.filter(l=>l.id!==d.id)})},
  dismiss(d){commit('忽略建議',()=>{DB.dismissed[d.key]=todayStr()})},
  migSeen(){commit('看過搬家提示',()=>{DB.settings.migSeen=true})},
  qfreq(d){const t=S.qfreq[+d.i];if(!t)return;closeSheet();addTxs([{id:uid(),kind:'expense',amount:t.amount,cur:t.cur,date:todayStr(),acct:(acc(t.acct)||card(t.acct))?t.acct:defaultPay(),to:'',merchant:t.merchant,cat:t.cat,tags:[...(t.tags||[])],source:'quick',confirm:'confirmed',occur:'occurred',note:'',ts:Date.now()}])},
  receipt(){$('#receiptFile').click()},
  askDecide(){const R=S.dres;if(!R)return;const df=S.df;runAI(AI_RULES+snapText()+`\n\n【使用者想買】${df.item||'未命名'}，${fmt(R.price)}，${md(R.date)} 用 ${srcName(R.pay)} 付${R.n>1?`，分期 ${R.n} 期，每期 ${fmt(R.per)}，費用 ${df.feeKnown?fmt(R.fee):'不確定'}`:''}；重要程度：${{must:'必要',value:'很重視',want:'想要'}[df.need]}。補充：${df.why||'無'}\n【系統計算】買前安全可支配 ${fmt(R.B.cashBasis)}，買後 ${fmt(R.A.cashBasis)}，含預估收入 ${fmt(R.A.future)}；新增的扣款不足：${R.newShort.map(s=>srcName(s.acct)+md(s.date)+fmt(s.need)).join('、')||'無'}；動用保留金 ${fmt(R.reserveHit)}；缺少資料：${R.missing.join('、')||'無'}。系統結論：${R.vt}。\n\n請用 ## 結論、## 取捨、## 替代做法、## 如果要買 回答。不要推翻系統計算的數字。`,'dai','daiBusy','daiOut')},
  checkup(){runAI(AI_RULES+snapText()+'\n\n請做財務健檢：## 整體狀況（一句話）、## 最該優先處理的 3 件事（依急迫性，附依據）、## 資料限制對判斷的影響。','checkup','checkBusy','ckOut')},
  stopAI(){aiCtl&&aiCtl.abort()},ask(d){askChat(d.q)},
  rmKey(){try{localStorage.removeItem('qt:apikey')}catch(e){}S.ai=null;closeSheet();render();toast('已移除金鑰')},
  async export(){commit('匯出備份',()=>{DB.settings.lastBackup=todayStr()});const data=JSON.stringify(DB,null,1);const name=`錢途備份v2-${todayStr()}.json`;const file=new File([data],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'錢途備份'});toast('備份已匯出');return}catch(e){if(e&&e.name==='AbortError')return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('備份已匯出')},
  import(){$('#importFile').click()},
  wipe(d,el){if(!el.dataset.sure){el.dataset.sure='1';el.textContent='確定？所有資料都會刪除（可用「復原」救回）';return}closeSheet();commit('清除全部資料',()=>{DB=defDB()},{toast:'已清除'})},
  async install(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;closeSheet();render()},
  hideInstall(){try{localStorage.setItem('qt:hideInstall','1')}catch(e){}render()}
};
let deferredInstall=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installBox(){if(isStandalone())return'';if(deferredInstall)return`<h3 style="margin-top:20px">安裝到手機</h3><button class="btn block" data-act="install">安裝「錢途」App</button>`;if(isIOS())return`<h3 style="margin-top:20px">安裝到手機</h3><div class="hint">用 Safari 開啟，點「分享」→「加入主畫面」。</div>`;return''}
function installBanner(){let hid=false;try{hid=localStorage.getItem('qt:hideInstall')==='1'}catch(e){}if(hid||isStandalone()||!(deferredInstall||isIOS()))return'';return`<div class="alert info"><span class="sym">i</span><div style="flex:1"><b>把錢途裝到主畫面</b>${deferredInstall?'像 App 一樣全螢幕開啟，也能離線使用。':'點 Safari 的「分享」→「加入主畫面」。'}<div class="btns" style="margin-top:8px">${deferredInstall?'<button class="btn sm" data-act="install">安裝</button>':''}<button class="btn ghost sm" data-act="hideInstall">不用了</button></div></div></div>`}

/* ================= wiring ================= */
function render(){
  const n=pendingRec().length+pendingStmts().length;const b=$('#pendBadge');b.hidden=!n;b.textContent=n;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===S.tab));$('#ttl').textContent=TITLES[S.tab];
  $('#syncNote').textContent='資料只在這支裝置'+(DB.settings.startDate?`・${md(DB.settings.startDate)} 起`:'');
  $('#view').innerHTML={home:vHome,txs:vTxs,flow:vFlow,accts:vAccts,advisor:vAdvisor}[S.tab]()}
function boot(){
  try{const t=location.hash.slice(1);if(TITLES[t])S.tab=t}catch(e){}
  try{const s=localStorage.getItem(KEY);if(s)DB=normDB(JSON.parse(s))}catch(e){}
  if(!DB){DB=defDB();const v1=readV1();if(v1){DB=normDB(migrateV1(v1));save()}}
  S.ai=makeAI();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render()}
if(typeof document!=='undefined'&&document.getElementById('view')){
  document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.tagName==='FORM')return;const fn=ACT[a.dataset.act];if(fn){e.preventDefault();fn(a.dataset,a,e)}});
  document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();FORMS[f.dataset.form]&&FORMS[f.dataset.form](new FormData(f),f)});
  document.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('qsel')){const it=S.qparse[+t.dataset.qi];if(it){it[t.dataset.qf]=t.value;if(t.dataset.qf==='acct')it.cur=card(t.value)?'TWD':curOf(t.value)}}
    if(t.classList&&t.classList.contains('impchk')&&S.imp){const x=S.imp.list[+t.dataset.ii];if(x)x.on=t.checked;impCount()}
    if(t.classList&&t.classList.contains('isel')&&S.imp){const x=S.imp.list[+t.dataset.ii];if(x){x[t.dataset.f]=t.value;if(t.dataset.f==='kind'){if(x.kind==='card_payment'&&!card(x.to))x.to=(cardFor(S.imp.src,x.desc)||{}).id||'';if(x.kind==='transfer'&&!acc(x.to))x.to='';if(['expense','refund','income'].includes(x.kind)){const g=guessCat(x.desc,x.kind==='refund'?'expense':x.kind,histMap());x.cat=g.cat;x.tags=g.tags}x.on=x.kind!=='skip';impRender()}}}
    if(t.classList&&t.classList.contains('impmap')&&S.imp){const v=+t.value;if(t.dataset.k==='desc')S.imp.map.desc=v>=0?[v]:[];else S.imp.map[t.dataset.k]=v;impRebuild();impRender()}
    if(t.classList&&t.classList.contains('impflip')&&S.imp){S.imp.flip=t.checked;impRebuild();impRender()}
    if(t.form&&t.form.dataset.form==='tx'&&t.name==='kind')syncTxForm();if(t.form&&t.form.id==='dform'){syncDf();if(t.name==='inst')$('#d-instbox').hidden=!t.checked}});
  document.addEventListener('input',e=>{if(e.target.id==='qIn'){S.qparse=parseAll(e.target.value);renderQPrev()}if(e.target.form&&e.target.form.id==='dform')syncDf()});
  document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('why')&&d.dataset.key)S.openSug[d.dataset.key]=d.open},true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
  document.addEventListener('touchstart',()=>{},{passive:true});wireSheetDrag();
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(DB)render()});
  $('#importFile').addEventListener('change',e=>{const file=e.target.files[0];e.target.value='';if(!file)return;const rd=new FileReader();rd.onload=()=>{let d;try{d=JSON.parse(rd.result)}catch(err){return toast('這不是有效的備份檔')}
    if(d&&d.v===2){closeSheet();commit('匯入備份',()=>{DB=normDB(d)},{toast:'備份已匯入'})}else if(d&&d.core){closeSheet();commit('匯入舊版備份',()=>{DB=normDB(migrateV1(d))},{toast:'舊版備份已轉換匯入'})}else toast('這不是錢途的備份檔')};rd.readAsText(file)});
  $('#impFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const text=await readImportFile(f);startImport(S.impSrc||(liveAccts()[0]||{}).id,text,f.name)}catch(err){toast(/xlsx/.test(String(err&&err.message))?'讀取 Excel 需要網路，請連線後再試，或改用 CSV':'沒辦法讀取這個檔案')}});
  $('#receiptFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||!aiOn())return;openSheet('<h3>讀取收據中…</h3><p class="muted">大約 10–30 秒。</p>');
    try{const out=await S.ai.json(`這是台灣的收據、電子發票或刷卡明細照片。只回傳 JSON 陣列：[{"merchant":"店名或主要品項","amount":數字,"cat":"類別","date":"YYYY-MM-DD 或 null"}]。一張發票只回一筆總額。類別只能從這裡選：${CAT_OUT.join('、')}。今天 ${todayStr()}。看不出來就回 []。`,{images:[f]});
      const arr=(Array.isArray(out)?out:[]).filter(x=>x&&num(x.amount)>0).slice(0,30).map(x=>{const at=autoTags(String(x.merchant||''));const p=defaultPay();return{id:uid(),kind:'expense',amount:r2(num(x.amount)),cur:card(p)?'TWD':curOf(p),date:/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')&&x.date<=todayStr()?x.date:todayStr(),acct:p,to:'',merchant:String(x.merchant||'').slice(0,40),cat:CAT_OUT.includes(x.cat)?x.cat:(at.cat||'其他'),tags:at.tags,source:'receipt',confirm:'confirmed',occur:'occurred',note:'',ts:Date.now()}});
      if(!arr.length)return openSheet('<h3>看不出金額</h3><p class="muted">請再拍一次，或直接打字記帳。</p><button class="btn block" data-act="quick">改用打字</button>');quickSheet(arr)}
    catch(err){openSheet(`<h3>沒辦法讀取</h3><p class="muted">${esc(aiErr(err))}</p><button class="btn block" data-act="quick">改用打字</button>`)}});
  boot();
  if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
